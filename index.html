<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>九九乘法拔河對抗賽 - 雙人對戰版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(180deg, #60a5fa 0%, #93c5fd 40%, #86efac 40%, #22c55e 100%);
      background-attachment: fixed;
    }
    .font-game {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    /* 雲朵飄動插畫動畫 */
    @keyframes cloudDrift1 {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(100vw); }
    }
    @keyframes cloudDrift2 {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(105vw); }
    }
    .cloud-1 {
      animation: cloudDrift1 45s linear infinite;
    }
    .cloud-2 {
      animation: cloudDrift2 65s linear infinite;
      animation-delay: -25s;
    }

    /* 最後 20 秒全畫面邊框閃動效果 */
    @keyframes urgentBorderFlash {
      0%, 100% {
        box-shadow: inset 0 0 0 8px rgba(239, 68, 68, 0.9), inset 0 0 35px rgba(239, 68, 68, 0.7);
        border-color: rgba(239, 68, 68, 0.9);
      }
      50% {
        box-shadow: inset 0 0 0 2px rgba(245, 158, 11, 0.3), inset 0 0 10px rgba(245, 158, 11, 0.2);
        border-color: rgba(245, 158, 11, 0.3);
      }
    }
    .urgent-flash {
      animation: urgentBorderFlash 0.65s ease-in-out infinite !important;
      opacity: 1 !important;
    }

    .rope-pattern {
      background: repeating-linear-gradient(
        45deg,
        #b45309,
        #b45309 8px,
        #d97706 8px,
        #d97706 16px,
        #92400e 16px,
        #92400e 24px
      );
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.35), 0 3px 6px rgba(0,0,0,0.25);
    }
    .key-btn {
      transition: all 0.08s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    }
    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes ropePullRed {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-12px); }
    }
    @keyframes ropePullBlue {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(12px); }
    }
    .pull-red {
      animation: ropePullRed 0.3s ease;
    }
    .pull-blue {
      animation: ropePullBlue 0.3s ease;
    }
    .scratch-canvas {
      touch-action: none;
      cursor: crosshair;
    }
    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden p-2 sm:p-4 relative">

  <!-- 最後 20 秒全螢幕閃爍外框層 -->
  <div id="urgent-vignette" class="pointer-events-none fixed inset-0 z-40 transition-all duration-300 opacity-0 border-8 border-transparent"></div>

  <!-- 背景圖畫插圖裝飾（天空白雲、遠處綠山坡、跑道與運動會彩旗） -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <!-- 漂浮白雲插圖 -->
    <div class="cloud-1 absolute top-4 left-0 opacity-80">
      <svg width="140" height="50" viewBox="0 0 140 50" fill="white">
        <path d="M20,40 Q10,40 10,30 Q10,18 25,18 Q30,6 48,10 Q60,2 75,10 Q90,5 98,18 Q115,18 115,30 Q115,40 105,40 Z" />
      </svg>
    </div>
    <div class="cloud-2 absolute top-14 left-0 opacity-70">
      <svg width="180" height="60" viewBox="0 0 180 60" fill="white">
        <path d="M25,50 Q12,50 12,38 Q12,22 30,22 Q38,8 60,12 Q75,2 95,12 Q115,6 125,22 Q145,22 145,38 Q145,50 130,50 Z" />
      </svg>
    </div>

    <!-- 運動會歡樂三角旗幟串 (Bunting Flags) -->
    <svg class="absolute top-0 left-0 w-full h-12" preserveAspectRatio="none" viewBox="0 0 1000 60">
      <path d="M0,8 Q250,22 500,8 Q750,22 1000,8" fill="none" stroke="#fed7aa" stroke-width="2" />
      <!-- 彩旗 -->
      <polygon points="40,9 65,9 52,38" fill="#ef4444" />
      <polygon points="90,11 115,11 102,40" fill="#3b82f6" />
      <polygon points="140,13 165,13 152,42" fill="#f59e0b" />
      <polygon points="190,14 215,14 202,43" fill="#10b981" />
      <polygon points="240,15 265,15 252,44" fill="#ec4899" />
      <polygon points="290,14 315,14 302,43" fill="#8b5cf6" />
      <polygon points="340,13 365,13 352,42" fill="#ef4444" />
      <polygon points="390,11 415,11 402,40" fill="#3b82f6" />
      <polygon points="440,9 465,9 452,38" fill="#f59e0b" />
      <polygon points="490,8 515,8 502,37" fill="#10b981" />
      <polygon points="540,9 565,9 552,38" fill="#ec4899" />
      <polygon points="590,11 615,11 602,40" fill="#8b5cf6" />
      <polygon points="640,13 665,13 652,42" fill="#ef4444" />
      <polygon points="690,14 715,14 702,43" fill="#3b82f6" />
      <polygon points="740,15 765,15 752,44" fill="#f59e0b" />
      <polygon points="790,14 815,14 802,43" fill="#10b981" />
      <polygon points="840,13 865,13 852,42" fill="#ec4899" />
      <polygon points="890,11 915,11 902,40" fill="#8b5cf6" />
      <polygon points="940,9 965,9 952,38" fill="#ef4444" />
    </svg>

    <!-- 草坪與紅色田徑跑道插畫線條 -->
    <div class="absolute bottom-0 inset-x-0 h-44 bg-gradient-to-t from-emerald-600 via-green-500 to-green-400 opacity-90"></div>
    <div class="absolute bottom-0 inset-x-0 h-10 bg-amber-800/20 border-t-2 border-white/40"></div>
  </div>

  <!-- 頂部控制列 -->
  <header class="max-w-4xl mx-auto w-full flex flex-col items-center gap-2 relative z-10">
    <div class="w-full flex items-center justify-between px-2">
      <div class="flex items-center gap-2 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-2xl shadow-md border border-amber-200">
        <span class="text-2xl sm:text-3xl">🪢</span>
        <h1 class="text-xl sm:text-2xl font-black text-amber-800 tracking-wide font-game">乘法拔河大對決</h1>
      </div>
      
      <!-- 計時器 -->
      <div id="timer-badge" class="bg-white/95 backdrop-blur-md border-2 border-amber-300 rounded-full px-4 py-1 flex items-center gap-2 shadow-md transition-all">
        <span class="text-sm font-bold text-slate-600">⏱️ 剩餘時間</span>
        <span id="timer-display" class="font-game font-black text-2xl sm:text-3xl text-amber-600 tracking-wider">180</span>
        <span class="text-xs text-slate-500 font-bold">秒</span>
      </div>
    </div>

    <!-- 難度選擇標籤 -->
    <div class="flex gap-2 w-full justify-center">
      <button id="lvl-1" onclick="changeLevel(1)" class="level-tab flex-1 sm:flex-initial text-xs sm:text-sm font-bold px-3 sm:px-5 py-1.5 rounded-full border-2 border-amber-500 bg-amber-400 text-amber-950 shadow-md transition-all">
        Lv.1 九九乘法
      </button>
      <button id="lvl-2" onclick="changeLevel(2)" class="level-tab flex-1 sm:flex-initial text-xs sm:text-sm font-bold px-3 sm:px-5 py-1.5 rounded-full border-2 border-white/80 bg-white/80 text-slate-700 hover:bg-white transition-all shadow">
        Lv.2 兩位×一位
      </button>
      <button id="lvl-3" onclick="changeLevel(3)" class="level-tab flex-1 sm:flex-initial text-xs sm:text-sm font-bold px-3 sm:px-5 py-1.5 rounded-full border-2 border-white/80 bg-white/80 text-slate-700 hover:bg-white transition-all shadow">
        Lv.3 三位×一位
      </button>
    </div>
  </header>

  <!-- 拔河競技場與比分 -->
  <section class="max-w-4xl mx-auto w-full my-1 sm:my-2 relative z-10">
    <!-- 雙方計分 -->
    <div class="flex justify-between items-end px-3 mb-2 font-game">
      <div class="flex items-center gap-2 bg-white/90 backdrop-blur px-3 py-1 rounded-xl shadow border border-red-200">
        <span class="text-2xl filter drop-shadow">🔴</span>
        <div>
          <div class="text-xs font-bold text-red-600">紅隊得分</div>
          <div id="red-score" class="text-2xl sm:text-3xl font-black text-red-600 leading-tight">0</div>
        </div>
      </div>
      <div class="text-center pb-1">
        <span class="text-xs font-bold px-3 py-1 rounded-full bg-white/95 text-slate-700 shadow border border-slate-200">🚩 目標：拉過決勝紅旗！</span>
      </div>
      <div class="flex items-center gap-2 flex-row-reverse text-right bg-white/90 backdrop-blur px-3 py-1 rounded-xl shadow border border-blue-200">
        <span class="text-2xl filter drop-shadow">🔵</span>
        <div>
          <div class="text-xs font-bold text-blue-600">藍隊得分</div>
          <div id="blue-score" class="text-2xl sm:text-3xl font-black text-blue-600 leading-tight">0</div>
        </div>
      </div>
    </div>

    <!-- 拔河繩索與人物互動可視化 (採用草地運動場沙坑設計) -->
    <div class="relative bg-white/90 backdrop-blur-md rounded-2xl p-3 sm:p-4 border-2 border-amber-300 shadow-xl overflow-hidden">
      <!-- 拔河場地標線 -->
      <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 flex justify-between px-6 pointer-events-none opacity-40">
        <div class="w-1 h-16 bg-red-500 rounded-full"></div>
        <div class="w-1 h-20 bg-amber-500 rounded-full"></div>
        <div class="w-1 h-16 bg-blue-500 rounded-full"></div>
      </div>

      <!-- 繩索本體軌道 -->
      <div id="tug-stage" class="relative h-14 flex items-center justify-center transition-transform duration-200">
        <!-- 繩索條 -->
        <div class="absolute left-8 right-8 h-4 rounded-full rope-pattern border-2 border-amber-900 z-10"></div>

        <!-- 左邊紅隊拉扯選手插圖 -->
        <div class="absolute left-2 top-1/2 -translate-y-1/2 z-20 flex items-center">
          <div class="text-2xl sm:text-3xl transform -scale-x-100">🏃‍♂️</div>
          <div class="text-2xl sm:text-3xl transform -scale-x-100 -ml-3">🤼</div>
        </div>

        <!-- 拔河中心標記（動態左右移動） -->
        <div id="rope-marker" class="absolute top-1/2 -translate-y-1/2 z-30 transition-all duration-300 ease-out flex flex-col items-center" style="left: 50%;">
          <div class="w-7 h-7 rounded-full bg-amber-400 border-2 border-red-500 shadow-lg flex items-center justify-center font-bold text-red-950 text-xs font-game animate-pulse">
            ★
          </div>
          <div class="w-3.5 h-5 bg-red-600 rounded-b -mt-1 shadow-md"></div>
        </div>

        <!-- 右邊藍隊拉扯選手插圖 -->
        <div class="absolute right-2 top-1/2 -translate-y-1/2 z-20 flex items-center">
          <div class="text-2xl sm:text-3xl -mr-3">🤼</div>
          <div class="text-2xl sm:text-3xl">🏃</div>
        </div>
      </div>

      <!-- 刻度提示 -->
      <div class="flex justify-between text-[11px] font-bold text-slate-500 px-4 mt-1">
        <span class="text-red-600 font-extrabold">◄ 紅隊勝區</span>
        <span class="text-amber-700">中線</span>
        <span class="text-blue-600 font-extrabold">藍隊勝區 ►</span>
      </div>
    </div>

    <!-- 當前乘法題目顯示 -->
    <div class="text-center my-2 sm:my-3">
      <div class="inline-block bg-white/95 backdrop-blur-md px-8 py-2 rounded-2xl border-2 border-amber-400 shadow-lg">
        <div class="text-xs font-bold text-slate-500 mb-0.5">題目爭奪中 (答對拉動繩索)</div>
        <div id="question-text" class="text-3xl sm:text-5xl font-black text-amber-600 font-game tracking-wider">
          準備開始
        </div>
      </div>
    </div>
  </section>

  <!-- 雙人手寫算草區 (Level 2 & 3 開啟) -->
  <section id="scratch-wrapper" class="max-w-4xl mx-auto w-full mb-2 hidden transition-all relative z-10">
    <div class="flex items-center justify-between px-2 mb-1">
      <span class="text-xs font-bold text-slate-800 bg-white/80 px-2 py-0.5 rounded shadow-sm">📝 直式手寫算草區（手指/觸控筆塗寫）</span>
      <button onclick="toggleScratchpads()" class="text-xs text-amber-900 bg-amber-200/90 font-bold px-2 py-0.5 rounded hover:bg-amber-300">收合/展開</button>
    </div>
    <div class="grid grid-cols-2 gap-2 sm:gap-4">
      <!-- 紅隊算草 -->
      <div class="bg-red-50/95 backdrop-blur-md rounded-xl p-2 border-2 border-red-300 flex flex-col shadow">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs font-black text-red-600">🔴 紅隊算草板</span>
          <button onclick="clearScratch('red')" class="text-[10px] bg-red-500 hover:bg-red-600 text-white font-bold px-2 py-0.5 rounded shadow">清除</button>
        </div>
        <div class="relative bg-white rounded-lg overflow-hidden border border-red-200 shadow-inner h-28 sm:h-36">
          <canvas id="canvas-red" class="scratch-canvas w-full h-full"></canvas>
        </div>
      </div>

      <!-- 藍隊算草 -->
      <div class="bg-blue-50/95 backdrop-blur-md rounded-xl p-2 border-2 border-blue-300 flex flex-col shadow">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs font-black text-blue-600">🔵 藍隊算草板</span>
          <button onclick="clearScratch('blue')" class="text-[10px] bg-blue-500 hover:bg-blue-600 text-white font-bold px-2 py-0.5 rounded shadow">清除</button>
        </div>
        <div class="relative bg-white rounded-lg overflow-hidden border border-blue-200 shadow-inner h-28 sm:h-36">
          <canvas id="canvas-blue" class="scratch-canvas w-full h-full"></canvas>
        </div>
      </div>
    </div>
  </section>

  <!-- 雙方獨立輸入鍵盤區 -->
  <footer class="max-w-4xl mx-auto w-full relative z-10">
    <div class="grid grid-cols-2 gap-3 sm:gap-6">
      <!-- 紅隊鍵盤區 -->
      <div class="bg-white/95 backdrop-blur-md border-2 border-red-300 rounded-2xl p-2 sm:p-3 flex flex-col items-center shadow-lg">
        <div class="flex items-center gap-1 mb-1">
          <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
          <span class="text-xs font-black text-red-600">紅隊輸入</span>
        </div>
        <input id="red-input" type="text" readonly placeholder="?" class="w-full text-center text-xl sm:text-2xl font-black bg-red-50 border-2 border-red-400 text-red-700 rounded-xl py-1 px-2 mb-2 tracking-widest font-game shadow-inner" />
        <div id="red-keypad" class="grid grid-cols-3 gap-1.5 w-full max-w-[200px]"></div>
      </div>

      <!-- 藍隊鍵盤區 -->
      <div class="bg-white/95 backdrop-blur-md border-2 border-blue-300 rounded-2xl p-2 sm:p-3 flex flex-col items-center shadow-lg">
        <div class="flex items-center gap-1 mb-1">
          <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
          <span class="text-xs font-black text-blue-600">藍隊輸入</span>
        </div>
        <input id="blue-input" type="text" readonly placeholder="?" class="w-full text-center text-xl sm:text-2xl font-black bg-blue-50 border-2 border-blue-400 text-blue-700 rounded-xl py-1 px-2 mb-2 tracking-widest font-game shadow-inner" />
        <div id="blue-keypad" class="grid grid-cols-3 gap-1.5 w-full max-w-[200px]"></div>
      </div>
    </div>

    <!-- 開始對戰浮動按鈕 -->
    <div class="flex justify-center mt-3 mb-1">
      <button id="start-btn" onclick="startGame()" class="px-8 py-3 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-900 font-black text-lg sm:text-xl rounded-full shadow-xl transform active:scale-95 transition-all animate-bounce border-2 border-white">
        🏁 開始拔河比賽！
      </button>
    </div>
  </footer>

  <!-- 結算彈跳視窗 -->
  <div id="win-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border-2 border-amber-400 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl">
      <div class="text-6xl mb-3" id="win-trophy">🏆</div>
      <h2 id="win-title" class="text-2xl sm:text-3xl font-black text-amber-300 font-game mb-2">紅隊獲得勝利！</h2>
      <p id="win-detail" class="text-sm text-slate-300 mb-6">拔河成功拉過判定點，反應神速！</p>
      
      <div class="bg-slate-900/80 rounded-xl p-3 mb-6 border border-slate-700 flex justify-around">
        <div>
          <div class="text-xs text-red-400 font-bold">紅隊總分</div>
          <div id="final-red" class="text-2xl font-black text-red-400 font-game">0</div>
        </div>
        <div class="w-px bg-slate-700"></div>
        <div>
          <div class="text-xs text-blue-400 font-bold">藍隊總分</div>
          <div id="final-blue" class="text-2xl font-black text-blue-400 font-game">0</div>
        </div>
      </div>

      <button onclick="resetGame()" class="w-full py-3 rounded-full font-black text-slate-900 bg-amber-400 hover:bg-amber-300 text-base shadow-lg transition-transform active:scale-95">
        🔄 再來一局對決
      </button>
    </div>
  </div>

  <script>
    /* ========== 音效合成器 (Web Audio API) ========== */
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playCorrect() {
        try {
          this.init();
          const t = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'triangle';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(523.25, t); // C5
          osc1.frequency.exponentialRampToValueAtTime(783.99, t + 0.12); // G5
          osc2.frequency.setValueAtTime(659.25, t); // E5
          osc2.frequency.exponentialRampToValueAtTime(1046.50, t + 0.15); // C6

          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(t);
          osc2.start(t);
          osc1.stop(t + 0.25);
          osc2.stop(t + 0.25);
        } catch(e) {}
      },
      playWrong() {
        try {
          this.init();
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, t);
          osc.frequency.linearRampToValueAtTime(110, t + 0.18);

          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(t);
          osc.stop(t + 0.2);
        } catch(e) {}
      },
      playTug() {
        try {
          this.init();
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(280, t);
          osc.frequency.exponentialRampToValueAtTime(420, t + 0.08);

          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.1);
        } catch(e) {}
      },
      playVictory() {
        try {
          this.init();
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const t = this.ctx.currentTime + (idx * 0.1);
            osc.frequency.value = freq;
            osc.type = 'triangle';
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.3);
          });
        } catch(e) {}
      }
    };

    // 遊戲核心狀態
    const MAX_STEPS = 6; // 拔河刻度（-6 紅勝, +6 藍勝）
    const LEVEL_CONFIG = {
      1: { time: 180, maxLen: 2, label: '九九乘法' },
      2: { time: 240, maxLen: 3, label: '兩位數×一位數' },
      3: { time: 300, maxLen: 4, label: '三位數×一位數' }
    };

    let currentLevel = 1;
    let tugPos = 0; // -6 到 +6
    let redScore = 0;
    let blueScore = 0;
    let timer = LEVEL_CONFIG[1].time;
    let timerId = null;
    let isPlaying = false;
    let currentAnswer = null;
    let questionPool = [];

    // 產生題目池
    function generateQuestionPool() {
      const list = [];
      if (currentLevel === 1) {
        // 九九乘法 2~9 × 2~9
        for (let a = 2; a <= 9; a++) {
          for (let b = 2; b <= 9; b++) {
            list.push([a, b]);
          }
        }
      } else if (currentLevel === 2) {
        // 兩位數 × 一位數 (11~99 × 2~9)
        for (let a = 11; a <= 99; a++) {
          for (let b = 2; b <= 9; b++) {
            list.push([a, b]);
          }
        }
      } else {
        // 三位數 × 一位數 (101~999 × 2~9)
        for (let a = 100; a <= 999; a += 3) {
          for (let b = 2; b <= 9; b++) {
            list.push([a, b]);
          }
        }
      }
      // 洗牌
      questionPool = list.sort(() => Math.random() - 0.5);
    }

    function nextQuestion() {
      if (questionPool.length === 0) {
        generateQuestionPool();
      }
      const [num1, num2] = questionPool.pop();
      currentAnswer = num1 * num2;
      document.getElementById('question-text').textContent = `${num1} × ${num2}`;
      // 清空雙方目前輸入框
      document.getElementById('red-input').value = '';
      document.getElementById('blue-input').value = '';
    }

    // 建立數字鍵盤
    function renderKeypads() {
      const teams = [
        { name: 'red', bg: 'bg-red-500 hover:bg-red-400 text-white', fnBg: 'bg-red-700 hover:bg-red-600 text-white' },
        { name: 'blue', bg: 'bg-blue-500 hover:bg-blue-400 text-white', fnBg: 'bg-blue-700 hover:bg-blue-600 text-white' }
      ];

      teams.forEach(({ name, bg, fnBg }) => {
        const container = document.getElementById(`${name}-keypad`);
        container.innerHTML = '';

        // 1-9
        for (let i = 1; i <= 9; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `key-btn ${bg} font-black text-lg sm:text-xl py-2 rounded-xl font-game`;
          btn.textContent = i;
          btn.onclick = () => handleDigit(name, i);
          container.appendChild(btn);
        }

        // 退格 ⌫
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = `key-btn ${fnBg} font-bold text-base py-2 rounded-xl`;
        delBtn.textContent = '⌫';
        delBtn.onclick = () => handleDelete(name);
        container.appendChild(delBtn);

        // 0
        const zeroBtn = document.createElement('button');
        zeroBtn.type = 'button';
        zeroBtn.className = `key-btn ${bg} font-black text-lg sm:text-xl py-2 rounded-xl font-game`;
        zeroBtn.textContent = '0';
        zeroBtn.onclick = () => handleDigit(name, 0);
        container.appendChild(zeroBtn);

        // 送出 ✓
        const enterBtn = document.createElement('button');
        enterBtn.type = 'button';
        enterBtn.id = `${name}-enter-btn`;
        enterBtn.className = `key-btn bg-emerald-500 hover:bg-emerald-400 text-white font-black text-lg py-2 rounded-xl`;
        enterBtn.textContent = 'OK';
        enterBtn.onclick = () => handleSubmit(name);
        container.appendChild(enterBtn);
      });
    }

    // 處理輸入數字
    function handleDigit(team, digit) {
      if (!isPlaying) return;
      const input = document.getElementById(`${team}-input`);
      const maxLen = LEVEL_CONFIG[currentLevel].maxLen;
      // 關鍵修復：依難度設定允許的位數（最高 4 位），避免原代碼長度小於 2 的限制 Bug
      if (input.value.length < maxLen) {
        input.value += String(digit);
      }
    }

    // 處理刪除
    function handleDelete(team) {
      if (!isPlaying) return;
      const input = document.getElementById(`${team}-input`);
      input.value = input.value.slice(0, -1);
    }

    // 提交答案判定
    function handleSubmit(team) {
      if (!isPlaying) return;
      const input = document.getElementById(`${team}-input`);
      const userVal = parseInt(input.value, 10);
      const stage = document.getElementById('tug-stage');

      if (isNaN(userVal)) return;

      if (userVal === currentAnswer) {
        // 答對！
        Sound.playCorrect();
        Sound.playTug();

        if (team === 'red') {
          redScore++;
          tugPos = Math.max(tugPos - 1, -MAX_STEPS);
          stage.classList.remove('pull-red', 'pull-blue');
          void stage.offsetWidth;
          stage.classList.add('pull-red');
        } else {
          blueScore++;
          tugPos = Math.min(tugPos + 1, MAX_STEPS);
          stage.classList.remove('pull-red', 'pull-blue');
          void stage.offsetWidth;
          stage.classList.add('pull-blue');
        }

        // 自動清除該隊算草板，提供下一題書寫空間
        clearScratch(team);
        updateArenaUI();

        // 判定是否達陣拔過勝利線
        if (Math.abs(tugPos) >= MAX_STEPS) {
          finishGame('tugout');
          return;
        }

        // 進入下一題
        nextQuestion();
      } else {
        // 答錯！
        Sound.playWrong();
        input.classList.remove('shake-anim');
        void input.offsetWidth;
        input.classList.add('shake-anim');
        input.value = '';
      }
    }

    // 更新拔河舞台與比分
    function updateArenaUI() {
      // 算出左邊百分比：-6 是 10%，0 是 50%，+6 是 90%
      const percentage = 50 + (tugPos / MAX_STEPS) * 38;
      const marker = document.getElementById('rope-marker');
      marker.style.left = `${percentage}%`;

      document.getElementById('red-score').textContent = redScore;
      document.getElementById('blue-score').textContent = blueScore;
      document.getElementById('timer-display').textContent = timer;
    }

    // 切換難度
    function changeLevel(lvl) {
      if (isPlaying) return;
      currentLevel = lvl;

      // 樣式更新
      [1, 2, 3].forEach(n => {
        const btn = document.getElementById(`lvl-${n}`);
        if (n === lvl) {
          btn.className = 'level-tab flex-1 sm:flex-initial text-xs sm:text-sm font-bold px-3 sm:px-5 py-1.5 rounded-full border-2 border-amber-500 bg-amber-400 text-amber-950 shadow-md';
        } else {
          btn.className = 'level-tab flex-1 sm:flex-initial text-xs sm:text-sm font-bold px-3 sm:px-5 py-1.5 rounded-full border-2 border-white/80 bg-white/80 text-slate-700 hover:bg-white shadow';
        }
      });

      // Level 2 與 3 自動顯示算草區
      const scratch = document.getElementById('scratch-wrapper');
      if (lvl >= 2) {
        scratch.classList.remove('hidden');
        resizeCanvases();
      } else {
        scratch.classList.add('hidden');
      }

      timer = LEVEL_CONFIG[lvl].time;
      document.getElementById('timer-display').textContent = timer;
    }

    function toggleScratchpads() {
      const scratch = document.getElementById('scratch-wrapper');
      scratch.classList.toggle('hidden');
      if (!scratch.classList.contains('hidden')) {
        resizeCanvases();
      }
    }

    // 開始遊戲
    function startGame() {
      if (isPlaying) return;
      Sound.init();
      isPlaying = true;
      tugPos = 0;
      redScore = 0;
      blueScore = 0;
      timer = LEVEL_CONFIG[currentLevel].time;

      // 重設倒數外框與警示樣式
      const vignette = document.getElementById('urgent-vignette');
      vignette.classList.remove('urgent-flash');
      const timerBadge = document.getElementById('timer-badge');
      timerBadge.className = 'bg-white/95 backdrop-blur-md border-2 border-amber-300 rounded-full px-4 py-1 flex items-center gap-2 shadow-md transition-all';
      document.getElementById('timer-display').className = 'font-game font-black text-2xl sm:text-3xl text-amber-600 tracking-wider';

      document.getElementById('start-btn').classList.add('hidden');
      document.getElementById('win-modal').classList.add('hidden');

      generateQuestionPool();
      updateArenaUI();
      nextQuestion();
      resizeCanvases();

      clearInterval(timerId);
      timerId = setInterval(() => {
        timer--;
        document.getElementById('timer-display').textContent = timer;

        // 最後 20 秒觸發全畫面外框呼吸閃動與警急倒數提示
        if (timer <= 20 && timer > 0) {
          vignette.classList.add('urgent-flash');
          timerBadge.className = 'bg-red-100 border-2 border-red-500 rounded-full px-4 py-1 flex items-center gap-2 shadow-lg scale-105 transition-all';
          document.getElementById('timer-display').className = 'font-game font-black text-2xl sm:text-3xl text-red-600 tracking-wider animate-pulse';
        }

        if (timer <= 0) {
          clearInterval(timerId);
          vignette.classList.remove('urgent-flash');
          finishGame('timeout');
        }
      }, 1000);
    }

    // 結束遊戲判定
    function finishGame(reason) {
      isPlaying = false;
      clearInterval(timerId);
      Sound.playVictory();

      // 關閉閃爍外框
      document.getElementById('urgent-vignette').classList.remove('urgent-flash');

      const modal = document.getElementById('win-modal');
      const trophy = document.getElementById('win-trophy');
      const title = document.getElementById('win-title');
      const detail = document.getElementById('win-detail');

      document.getElementById('final-red').textContent = redScore;
      document.getElementById('final-blue').textContent = blueScore;

      if (tugPos < 0) {
        trophy.textContent = '🔴 🏆';
        title.textContent = '紅隊榮獲冠軍！';
        detail.textContent = reason === 'tugout' ? '繩索完全被紅隊拉過決勝線！' : '時間到！紅隊佔據拔河優勢勝出！';
        title.className = 'text-2xl sm:text-3xl font-black text-red-500 font-game mb-2';
      } else if (tugPos > 0) {
        trophy.textContent = '🔵 🏆';
        title.textContent = '藍隊榮獲冠軍！';
        detail.textContent = reason === 'tugout' ? '繩索完全被藍隊拉過決勝線！' : '時間到！藍隊佔據拔河優勢勝出！';
        title.className = 'text-2xl sm:text-3xl font-black text-blue-500 font-game mb-2';
      } else {
        trophy.textContent = '🤝 ⚖️';
        title.textContent = '勢均力敵，平手！';
        detail.textContent = '雙方實力不相上下，難分勝負！';
        title.className = 'text-2xl sm:text-3xl font-black text-amber-500 font-game mb-2';
      }

      modal.classList.remove('hidden');
    }

    // 重置遊戲
    function resetGame() {
      document.getElementById('win-modal').classList.add('hidden');
      document.getElementById('start-btn').classList.remove('hidden');
      document.getElementById('urgent-vignette').classList.remove('urgent-flash');
      
      const timerBadge = document.getElementById('timer-badge');
      timerBadge.className = 'bg-white/95 backdrop-blur-md border-2 border-amber-300 rounded-full px-4 py-1 flex items-center gap-2 shadow-md transition-all';
      document.getElementById('timer-display').className = 'font-game font-black text-2xl sm:text-3xl text-amber-600 tracking-wider';

      tugPos = 0;
      redScore = 0;
      blueScore = 0;
      timer = LEVEL_CONFIG[currentLevel].time;
      document.getElementById('question-text').textContent = '準備開始';
      document.getElementById('red-input').value = '';
      document.getElementById('blue-input').value = '';
      clearScratch('red');
      clearScratch('blue');
      updateArenaUI();
    }

    // 雙手寫算草板（真實 Canvas 塗鴉，支援滑鼠與多點觸控）
    const canvases = { red: null, blue: null };
    const ctxs = { red: null, blue: null };
    const isDrawing = { red: false, blue: false };

    function initCanvases() {
      ['red', 'blue'].forEach(team => {
        const c = document.getElementById(`canvas-${team}`);
        canvases[team] = c;
        ctxs[team] = c.getContext('2d');

        // 觸控事件
        c.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          startDraw(team, touch.clientX, touch.clientY);
        }, { passive: false });

        c.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          moveDraw(team, touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchend', () => stopDraw(team));

        // 滑鼠事件
        c.addEventListener('mousedown', (e) => startDraw(team, e.clientX, e.clientY));
        c.addEventListener('mousemove', (e) => moveDraw(team, e.clientX, e.clientY));
        window.addEventListener('mouseup', () => stopDraw(team));
      });
      resizeCanvases();
    }

    function resizeCanvases() {
      ['red', 'blue'].forEach(team => {
        const c = canvases[team];
        if (!c) return;
        const rect = c.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          // 保存現有繪製內容防止重繪時丟失
          const temp = ctxs[team].getImageData(0, 0, c.width, c.height);
          c.width = rect.width;
          c.height = rect.height;
          ctxs[team].lineWidth = 3;
          ctxs[team].lineCap = 'round';
          ctxs[team].lineJoin = 'round';
          ctxs[team].strokeStyle = team === 'red' ? '#b91c1c' : '#1d4ed8';
          drawGrid(team);
          try {
            ctxs[team].putImageData(temp, 0, 0);
          } catch(e) {}
        }
      });
    }

    function drawGrid(team) {
      const c = canvases[team];
      const ctx = ctxs[team];
      if (!c || !ctx) return;
      ctx.save();
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      const step = 20;
      for (let x = step; x < c.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, c.height);
        ctx.stroke();
      }
      for (let y = step; y < c.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(c.width, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function startDraw(team, clientX, clientY) {
      const c = canvases[team];
      const ctx = ctxs[team];
      const rect = c.getBoundingClientRect();
      isDrawing[team] = true;
      ctx.beginPath();
      ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }

    function moveDraw(team, clientX, clientY) {
      if (!isDrawing[team]) return;
      const c = canvases[team];
      const ctx = ctxs[team];
      const rect = c.getBoundingClientRect();
      ctx.lineTo(clientX - rect.left, clientY - rect.top);
      ctx.stroke();
    }

    function stopDraw(team) {
      isDrawing[team] = false;
    }

    function clearScratch(team) {
      const c = canvases[team];
      const ctx = ctxs[team];
      if (c && ctx) {
        ctx.clearRect(0, 0, c.width, c.height);
        drawGrid(team);
      }
    }

    // 視窗大小改變時重設 Canvas 尺寸
    window.addEventListener('resize', resizeCanvases);

    // 初始化啟動
    window.onload = function() {
      renderKeypads();
      initCanvases();
      updateArenaUI();
    };
  </script>
</body>
</html>
